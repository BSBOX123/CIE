# api.mukeodo.site 리버스 프록시.
#
#   sudo cp infra/nginx-api.conf /etc/nginx/sites-available/api.mukeodo.site
#   sudo ln -s /etc/nginx/sites-available/api.mukeodo.site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 그다음 certbot 이 이 파일에 443 블록과 인증서 경로를 자동으로 채워 넣는다.
#   sudo certbot --nginx -d api.mukeodo.site

server {
    listen 80;
    server_name api.mukeodo.site;

    # 업로드 본문 크기. 주문카드 요청은 작지만 여유를 둔다.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 이 헤더가 없으면 앱이 자신을 http 로 알고 문서·리다이렉트 URL 을
        # http 로 내보낸다. application.yml 의 forward-headers-strategy 와 짝이다.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # CORS 헤더를 여기서 추가하지 말 것. 백엔드(CorsConfig)가 이미 붙이며,
        # 중복되면 브라우저가 오히려 요청을 거부한다.

        # 태깅 배치는 응답이 오래 걸릴 수 있다.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }
}
