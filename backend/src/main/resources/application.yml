server:
  # nginx 뒤에 있을 때 X-Forwarded-* 를 신뢰한다. 이게 없으면 앱이 자신을
  # http 로 인식해 리다이렉트·문서 URL 이 http 로 나가고, 브라우저가 막는다.
  forward-headers-strategy: framework

spring:
  application:
    name: meogeodo-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/meogeodo?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:meogeodo}
    password: ${DB_PASSWORD:meogeodo}
  jpa:
    hibernate:
      # 스키마는 Flyway가 관리한다. Hibernate가 손대지 않게 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      # MySQL 에는 타임존 인식 타입이 없다. UTC 로 저장하고 표시할 때 변환한다.
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

meogeodo:
  security:
    # 건강정보(질환·알레르기·복용약) 컬럼 암호화 키. Base64, 32바이트 권장.
    #   생성: openssl rand -base64 32
    # 없으면 저장 시 기동이 아니라 저장 시점에 실패한다 — 평문 저장을 막기 위함.
    encryption-key: ${MEOGEODO_ENCRYPTION_KEY:}
    # JWT 서명 키. 32바이트 이상.
    #   생성: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: PT12H
    # 브라우저에서 이 API 를 호출할 수 있는 프론트 출처. 쉼표로 여러 개.
    # 스킴·호스트·포트가 정확히 일치해야 한다 (www 나 http 는 별개 출처다).
    # 프론트를 로컬에서 띄울 때: CORS_ALLOWED_ORIGINS=https://mukeodo.site,http://localhost:5173
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mukeodo.site}

  public-data:
    # 이미 URL 인코딩된 키다. 재인코딩하면 인증이 깨진다 (SPEC 6.2).
    api-key: ${PUBLIC_DATA_API_KEY:}
    kor-service-base-url: https://apis.data.go.kr/B551011/KorService2
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  openapi:
    # Swagger UI 의 Servers 목록에 뜨는 배포 주소. 예: https://api.example.com
    # 비우면 문서를 연 주소에서 추론한다.
    server-url: ${PUBLIC_BASE_URL:}
  # 배치는 명시적으로 켤 때만 돈다. 개발 중 실수로 전국 수집이 돌거나
  # LLM 배치가 제출되는 것을 막는다.
  ingest:
    scheduled: ${INGEST_SCHEDULED:false}
  tagging:
    scheduled: ${TAGGING_SCHEDULED:false}
    # 한 번에 처리할 음식 수. 무료 티어의 일일 요청 한도를 넘지 않게 잡는다.
    # AI Studio 의 Rate limit 페이지에서 실제 한도를 확인해 조정할 것.
    chunk-size: ${TAGGING_CHUNK_SIZE:50}

springdoc:
  # 문서 JSON: /v3/api-docs, UI: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 운영에서 문서를 감추려면 SWAGGER_ENABLED=false 로 끈다.
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    # Authorize 에 넣은 토큰을 새로고침해도 유지한다.
    persist-authorization: true
  # 내부용 경로는 문서에 싣지 않는다.
  paths-to-match: /api/**

logging:
  level:
    com.meogeodo: INFO
