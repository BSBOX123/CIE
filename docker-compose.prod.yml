# 서버 배포용. 로컬 개발은 docker-compose.yml (db 만) 을 쓴다.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 호스트 포트는 전부 127.0.0.1 에만 묶는다. 외부 노출은 nginx 가 443 으로만 받는다.
# 보안 그룹에서 8080·8000·3307 을 여는 일이 없도록 할 것.
services:
  db:
    image: mysql:8.0
    container_name: meogeodo-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # 1GB 서버에서 MySQL 이 메모리를 다 먹지 않게 줄인다. 기본값은 128M.
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: meogeodo
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME 를 .env 에 넣으세요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 넣으세요}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 를 .env 에 넣으세요}
    # 앱은 도커 네트워크로 붙는다. 이 매핑은 SSH 터널로 들여다보기 위한 것.
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["meogeodo-mysqldata:/var/lib/mysql"]
    mem_limit: 420m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  ai-service:
    build: ./ai-service
    container_name: meogeodo-ai
    restart: unless-stopped
    env_file: [.env]
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 220m

  backend:
    build: ./backend
    container_name: meogeodo-backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      # 컨테이너끼리는 서비스 이름으로 붙는다. localhost 가 아니다.
      DB_URL: jdbc:mysql://db:3306/meogeodo?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&rewriteBatchedStatements=true
      AI_SERVICE_URL: http://ai-service:8000
      # 컨테이너 메모리(380m) 안에서 힙을 고정한다. 나머지는 JVM 자체와 스택이 쓴다.
      JAVA_OPTS: "-Xmx240m -Xss512k -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    env_file: [.env]
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 380m

volumes:
  meogeodo-mysqldata:
