services:
  db:
    image: mysql:8.0
    container_name: meogeodo-db
    command:
      # 한글과 이모지를 위해 utf8mb4. utf8(3바이트)로는 깨진다.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 애플리케이션이 UTC 로 저장하므로 서버도 UTC 로 맞춘다.
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: meogeodo
      MYSQL_USER: meogeodo
      MYSQL_PASSWORD: ${DB_PASSWORD:-meogeodo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpw}
    # 호스트 3306 은 이미 설치된 MySQL 9.2 가 쓰고 있으므로 3307 로 뺀다.
    # 기존 설치본을 건드리지 않기 위함이다.
    #
    # 127.0.0.1 에 묶는다. 이걸 빼면 0.0.0.0 이라 서버에서는 DB 가 인터넷에
    # 열린다. 도커는 iptables 를 직접 건드려 ufw 같은 호스트 방화벽을
    # 우회하므로 방화벽만 믿을 수 없다.
    # 백엔드는 같은 도커 네트워크에서 db:3306 으로 붙으므로 호스트 포트를
    # 열 필요가 없다. 이 매핑은 사람이 mysql 클라이언트나 GUI 로 들여다보기
    # 위한 것이다 (docs/DB.md).
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["meogeodo-mysqldata:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  meogeodo-mysqldata:
