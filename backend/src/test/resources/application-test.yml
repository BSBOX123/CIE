# 통합 테스트용 인메모리 DB (H2 의 MySQL 호환 모드).
#
# H2 는 MySQL 을 완전히 재현하지 못한다(JSON 처리, 예약어, 문자셋). 여기서는
# 엔티티 매핑과 서비스 로직만 검증하고, 스키마 자체는 실제 MySQL 을 띄워
# 따로 확인해야 한다.
spring:
  datasource:
    url: jdbc:h2:mem:meogeodo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      # 어휘 시드를 테스트에서 따로 관리하면 정본과 어긋난다.
      # 실제 마이그레이션 파일을 그대로 실행한다 (V4는 JSONB 등
      # H2가 못 다루는 타입을 쓰지 않아 그대로 돌아간다).
      # 앞의 reset 은 테이블을 비우기만 하고 시드 내용은 갖지 않는다.
      data-locations:
        - classpath:vocabulary-reset.sql
        - classpath:db/migration/V4__vocabulary.sql
        - classpath:test-feedback-vocabulary.sql

meogeodo:
  local-food:
    # 운영 기본값은 0(끔)이다. 테스트는 메뉴로 찾는 경로까지 확인한다.
    menu-probe-count: 30
  security:
    # 테스트 전용 고정 더미 값. 비밀이 아니므로 공개 저장소에 그대로 있어도 된다.
    #
    # 운영은 환경변수(MEOGEODO_ENCRYPTION_KEY, JWT_SECRET)로만 받는다.
    # application.yml 의 기본값이 비어 있어 여기로 폴백하지 않으며,
    # 이 파일은 src/test 라 bootJar 에도 들어가지 않는다.
    #
    # 랜덤으로 만들지 않고 고정하는 이유: H2 가 이름 있는 인메모리 DB
    # (jdbc:h2:mem:meogeodo)라 여러 스프링 컨텍스트가 같은 DB 를 공유한다.
    # 컨텍스트마다 키가 다르면 A 가 암호화한 행을 B 가 못 읽는다.
    #
    # 암호화 키는 디코드했을 때 정확히 32바이트여야 한다.
    #   PUBLIC-TEST-KEY-NOT-A-SECRET!!!!
    encryption-key: "UFVCTElDLVRFU1QtS0VZLU5PVC1BLVNFQ1JFVCEhISE="
    jwt-secret: "PUBLIC-TEST-JWT-NOT-A-SECRET-DO-NOT-USE-IN-PROD"
    access-token-ttl: PT1H

  public-data:
    api-key: test-key
    kor-service-base-url: http://localhost/unused
  ai-service:
    base-url: http://localhost/unused
